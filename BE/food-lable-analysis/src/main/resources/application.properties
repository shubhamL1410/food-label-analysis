spring.application.name=food-lable-analysis
gemini.api.key=${GEMINI_API_KEY}

spring.data.mongodb.uri=${MONGO_URI}

spring.data.mongodb.database=food_label_analysis
security_key=${SECURITY_KEY}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.http.multipart.max-file-size=50MB
spring.http.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=50MB
server.max-http-header-size=50MB
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
fastapi.base-url=${FASTAPI_URL}
app.images.path=../../FE/FLA/public/images
admin.username=${ADMIN_USERNAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
